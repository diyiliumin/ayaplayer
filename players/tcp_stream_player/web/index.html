<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ayaplayer · tcp stream</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1e26;
    --accent: #4f8cff;
    --text: #e8ebf0;
    --muted: #8b93a1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1c2230 0%, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .player {
    width: min(420px, 92vw);
    background: var(--card);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .disc {
    width: 180px;
    height: 180px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background:
      radial-gradient(circle, #2a2f3a 0 8%, #14161c 8% 100%),
      repeating-radial-gradient(circle, #171a20 0 3px, #0e1014 3px 5px);
    border: 6px solid #0a0c0f;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 6px 18px rgba(0,0,0,0.5);
    animation: spin 4s linear infinite;
    animation-play-state: paused;
  }
  .disc.spin { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  #status {
    color: var(--muted);
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 24px;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 34px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.97); }
  .volume {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
</style>
</head>
<body>
  <div class="player">
    <div class="disc" id="disc"></div>
    <h1>ayaplayer</h1>
    <div id="status">等待连接...</div>
    <audio id="audio" preload="auto"></audio>
    <button id="play">开始播放</button>
    <div class="volume">
      <span>音量</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
    </div>
  </div>
<script>
  const audio = document.getElementById('audio');
  const status = document.getElementById('status');
  const playBtn = document.getElementById('play');
  const vol = document.getElementById('volume');
  const disc = document.getElementById('disc');

  let unlocked = false;
  let retryTimer = null;
  const retryDelay = 1000;

  function setStatus(t) { status.textContent = t; }

  function connect() {
    clearTimeout(retryTimer);
    setStatus('连接中...');
    audio.src = '/stream?t=' + Date.now();
    audio.load();
    if (unlocked) audio.play().catch(() => {});
  }

  audio.addEventListener('playing', () => {
    setStatus('正在播放');
    playBtn.textContent = '暂停';
    disc.classList.add('spin');
  });
  audio.addEventListener('pause', () => {
    playBtn.textContent = '播放';
    disc.classList.remove('spin');
  });
  audio.addEventListener('waiting', () => setStatus('缓冲中...'));
  audio.addEventListener('stalled', () => setStatus('缓冲中...'));
  audio.addEventListener('ended', () => {
    setStatus('播放结束，等待下一首...');
    disc.classList.remove('spin');
    retryTimer = setTimeout(connect, retryDelay);
  });
  audio.addEventListener('error', () => {
    setStatus('未连接，等待播放器...');
    disc.classList.remove('spin');
    retryTimer = setTimeout(connect, retryDelay);
  });

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      unlocked = true;
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
  });

  vol.addEventListener('input', e => { audio.volume = parseFloat(e.target.value); });

  connect();
</script>
</body>
</html>
