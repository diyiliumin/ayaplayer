<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>🎵 霓虹音乐厅</title>
<style>
:root {
    --accent: #ff2e88;
    --accent2: #00e5ff;
    --bg1: #0a0a1f;
    --bg2: #1a0a2e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, var(--bg2), var(--bg1));
    font-family: -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
    color: #fff;
    user-select: none;
    transition: background 1s ease;
}

/* 动态氛围背景 */
body::before {
    content: '';
    position: fixed;
    inset: -50%;
    background: conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent));
    opacity: 0.06;
    animation: aura 20s linear infinite;
    pointer-events: none;
    filter: blur(80px);
}
@keyframes aura {
    to { transform: rotate(360deg); }
}

/* ============ 布局 ============ */
.stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1;
}

/* ============ 标题区 ============ */
.header {
    position: absolute;
    top: 24px;
    left: 0;
    right: 0;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
}

.title-block {
    flex: 1;
    min-width: 0;
}

.title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: linear-gradient(90deg, #fff, #b8b8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.subtitle {
    margin-top: 4px;
    font-size: 12px;
    color: #888;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: monospace;
}

.status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3fb950;
    margin-right: 6px;
    box-shadow: 0 0 10px #3fb950;
    animation: pulse 2s ease-in-out infinite;
}
.status-dot.paused { background: #ff9800; box-shadow: 0 0 10px #ff9800; }
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

/* 剩余次数圆环 */
.left-ring {
    position: relative;
    width: 64px;
    height: 64px;
    flex-shrink: 0;
}
.left-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}
.left-ring .track {
    fill: none;
    stroke: rgba(255,255,255,0.1);
    stroke-width: 4;
}
.left-ring .progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s ease;
    filter: drop-shadow(0 0 6px var(--accent));
}
.left-ring .num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
}

/* ============ 黑胶唱片 ============ */
.vinyl-wrap {
    position: relative;
    width: min(60vmin, 420px);
    height: min(60vmin, 420px);
    margin: 20px 0;
}

/* 外圈光环 */
.vinyl-wrap::before,
.vinyl-wrap::after {
    content: '';
    position: absolute;
    inset: -8%;
    border-radius: 50%;
    border: 2px solid transparent;
    background: conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent)) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: spin 8s linear infinite;
    opacity: 0.7;
}
.vinyl-wrap::after {
    inset: -16%;
    animation-duration: 14s;
    animation-direction: reverse;
    opacity: 0.35;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}

/* 唱片主体 */
.vinyl {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    box-shadow:
        0 0 80px rgba(255, 46, 136, 0.4),
        0 0 160px rgba(0, 229, 255, 0.2),
        inset 0 0 60px rgba(0,0,0,0.8);
    animation: spin 20s linear infinite;
    transition: animation-play-state 0.3s;
    background: #000;
}
.vinyl.paused {
    animation-play-state: paused;
}

.vinyl img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.5s ease;
}

/* 中心孔 */
.vinyl::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 18%;
    height: 18%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--bg1) 40%, rgba(255,255,255,0.15) 70%, transparent 72%);
    box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
}

/* 唱片纹理（播放中） */
.vinyl:not(.paused)::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-radial-gradient(
        circle,
        transparent 0,
        transparent 4px,
        rgba(255,255,255,0.03) 4px,
        rgba(255,255,255,0.03) 5px
    );
    pointer-events: none;
    z-index: 2;
}

/* ============ 音频可视化 ============ */
.bars {
    position: absolute;
    bottom: 140px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    height: 40px;
    align-items: flex-end;
    opacity: 0.9;
}
.bar {
    width: 4px;
    background: linear-gradient(to top, var(--accent), var(--accent2));
    border-radius: 2px;
    animation: bar 0.8s ease-in-out infinite;
    height: 4px;
}
.bar:nth-child(1)  { animation-delay: 0s;    }
.bar:nth-child(2)  { animation-delay: 0.1s;  }
.bar:nth-child(3)  { animation-delay: 0.2s;  }
.bar:nth-child(4)  { animation-delay: 0.3s;  }
.bar:nth-child(5)  { animation-delay: 0.4s;  }
.bar:nth-child(6)  { animation-delay: 0.5s;  }
.bar:nth-child(7)  { animation-delay: 0.4s;  }
.bar:nth-child(8)  { animation-delay: 0.3s;  }
.bar:nth-child(9)  { animation-delay: 0.2s;  }
.bar:nth-child(10) { animation-delay: 0.1s;  }
.bar:nth-child(11) { animation-delay: 0.15s; }
.bar:nth-child(12) { animation-delay: 0.25s; }
@keyframes bar {
    0%, 100% { height: 4px;  }
    50%      { height: 36px; }
}
.bars.paused .bar {
    animation-play-state: paused;
    height: 4px;
}

/* ============ 控制按钮 ============ */
.controls {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 0 20px;
}

.btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    position: relative;
    overflow: hidden;
}

.btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 60%);
    opacity: 0;
    transition: opacity 0.2s;
}

.btn:hover {
    background: rgba(255,255,255,0.12);
    transform: scale(1.06);
    border-color: var(--accent);
    box-shadow: 0 0 24px rgba(255, 46, 136, 0.4);
}
.btn:hover::before { opacity: 1; }

.btn:active {
    transform: scale(0.95);
}

.btn.primary {
    width: 72px;
    height: 72px;
    font-size: 26px;
    background: linear-gradient(135deg, var(--accent), #c424ff);
    border: none;
    box-shadow: 0 8px 32px rgba(255, 46, 136, 0.5);
}
.btn.primary:hover {
    box-shadow: 0 8px 40px rgba(255, 46, 136, 0.7);
    transform: scale(1.08);
}

.btn.danger:hover {
    border-color: #f85149;
    box-shadow: 0 0 24px rgba(248, 81, 73, 0.5);
}

/* ============ 数字键盘 ============ */
.numbers {
    position: absolute;
    top: 50%;
    right: 20px;
    transform: translateY(-50%);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    opacity: 0.6;
    transition: opacity 0.3s;
}
.numbers:hover { opacity: 1; }

.num-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    color: #aaa;
    font-size: 13px;
    font-family: monospace;
    cursor: pointer;
    transition: all 0.15s;
}
.num-btn:hover {
    background: rgba(255, 46, 136, 0.2);
    color: #fff;
    border-color: var(--accent);
    transform: scale(1.1);
}
.num-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 16px var(--accent);
}

/* ============ 暂停遮罩 ============ */
.pause-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.3s ease;
}
.pause-overlay.show { display: flex; }
.pause-overlay .text {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;
    text-shadow: 0 0 40px var(--accent);
}
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* ============ 连接状态 ============ */
.conn-status {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    color: #555;
    font-family: monospace;
    letter-spacing: 1px;
}
.conn-status.ok    { color: #3fb950; }
.conn-status.error { color: #f85149; }

/* ============ 响应式 ============ */
@media (max-width: 600px) {
    .vinyl-wrap { width: min(75vmin, 340px); height: min(75vmin, 340px); }
    .title { font-size: 16px; }
    .left-ring { width: 52px; height: 52px; }
    .left-ring .num { font-size: 16px; }
    .btn { width: 48px; height: 48px; font-size: 17px; }
    .btn.primary { width: 60px; height: 60px; font-size: 22px; }
    .numbers { grid-template-columns: repeat(3, 1fr); }
    .num-btn { width: 32px; height: 32px; font-size: 11px; }
    .bars { bottom: 110px; height: 30px; }
}
</style>
</head>
<body>

<div class="stage">

    <!-- 顶部标题 -->
    <div class="header">
        <div class="title-block">
            <div class="title" id="title">等待播放...</div>
            <div class="subtitle">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">连接中...</span>
            </div>
        </div>
        <div class="left-ring">
            <svg viewBox="0 0 64 64">
                <circle class="track" cx="32" cy="32" r="28"/>
                <circle class="progress" id="ring-progress" cx="32" cy="32" r="28"
                    stroke-dasharray="175.93"
                    stroke-dashoffset="175.93"/>
            </svg>
            <div class="num" id="songleft">-</div>
        </div>
    </div>

    <!-- 黑胶唱片 -->
    <div class="vinyl-wrap">
        <div class="vinyl paused" id="vinyl">
            <img id="cover" src="" alt=""
                 onerror="this.style.opacity=0">
        </div>
    </div>

    <!-- 音频可视化 -->
    <div class="bars paused" id="bars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <!-- 数字键盘 -->
    <div class="numbers" id="numbers">
        <button class="num-btn" data-num="1">1</button>
        <button class="num-btn" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
        <button class="num-btn" data-num="4">4</button>
        <button class="num-btn" data-num="5">5</button>
        <button class="num-btn" data-num="6">6</button>
        <button class="num-btn" data-num="7">7</button>
        <button class="num-btn" data-num="8">8</button>
        <button class="num-btn" data-num="9">9</button>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
        <button class="btn danger" id="btn-quit" title="退出播放">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>

        <button class="btn primary" id="btn-pause" title="暂停/播放">
            <svg id="icon-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="5" width="4" height="14" rx="1"/>
                <rect x="14" y="5" width="4" height="14" rx="1"/>
            </svg>
            <svg id="icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                <polygon points="6,4 20,12 6,20"/>
            </svg>
        </button>

        <button class="btn" id="btn-skip" title="跳过">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5,4 15,12 5,20"/>
                <rect x="17" y="4" width="3" height="16" rx="1"/>
            </svg>
        </button>
    </div>

    <div class="conn-status" id="conn-status">● 连接中</div>
</div>

<!-- 暂停遮罩 -->
<div class="pause-overlay" id="pause-overlay">
    <div class="text">暂停</div>
</div>

<script>
// ============================================
// WebSocket
// ============================================
const wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
const ws = new WebSocket(wsProto + location.host + '/ws');

const $ = id => document.getElementById(id);

let currentState = { paused: false, songleft: 0, cover: '', title: '' };
let lastCover = '';

// ============================================
// WebSocket 消息
// ============================================
ws.onopen = () => {
    setConn('ok', '● 已连接');
    console.log('✅ WebSocket 连接成功');
};

ws.onclose = () => {
    setConn('error', '● 断开');
    // 自动重连
    setTimeout(() => location.reload(), 2000);
};

ws.onerror = (e) => {
    setConn('error', '● 错误');
    console.error(e);
};

ws.onmessage = (e) => {
    try {
        const s = JSON.parse(e.data);
        updateUI(s);
    } catch (err) {
        console.error('解析失败:', err);
    }
};

// ============================================
// 更新 UI
// ============================================
function updateUI(s) {
    currentState = s;

    // 标题
    $('title').textContent = s.title || '等待播放...';

    // 剩余次数
    $('songleft').textContent = s.songleft;
    // 圆环进度（假设最多 9 次）
    const maxLeft = 9;
    const progress = Math.max(0, Math.min(1, s.songleft / maxLeft));
    const circumference = 2 * Math.PI * 28;
    $('ring-progress').style.strokeDashoffset = circumference * (1 - progress);

    // 暂停状态
    const isPaused = s.paused;
    $('vinyl').classList.toggle('paused', isPaused);
    $('bars').classList.toggle('paused', isPaused);
    $('pause-overlay').classList.toggle('show', isPaused);

    // 图标切换
    $('icon-pause').style.display = isPaused ? 'none' : 'block';
    $('icon-play').style.display  = isPaused ? 'block' : 'none';

    // 状态点
    const dot = $('status-dot');
    dot.classList.toggle('paused', isPaused);
    $('status-text').textContent = isPaused ? '已暂停' : '播放中';

    // 封面
    if (s.cover && s.cover !== lastCover) {
        const img = $('cover');
        img.src = '/cover?t=' + Date.now();
        img.style.opacity = 0;
        img.onload = () => { img.style.opacity = 1; };
        lastCover = s.cover;
    }
}

function setConn(cls, text) {
    const el = $('conn-status');
    el.className = 'conn-status ' + cls;
    el.textContent = text;
}

// ============================================
// 控制
// ============================================
function send(action, data = '') {
    if (ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ action, data }));
}

// 暂停/播放
$('btn-pause').onclick = () => {
    send('pause', currentState.paused ? 'false' : 'true');
};

$('pause-overlay').onclick = () => {
    send('pause', currentState.paused ? 'false' : 'true');
};

// 跳过
$('btn-skip').onclick = () => {
    send('skip', '');
};

// 退出
$('btn-quit').onclick = () => {
    if (confirm('确定退出播放？')) {
        send('quit', '');
    }
};

// 数字按钮
document.querySelectorAll('.num-btn').forEach(btn => {
    btn.onclick = () => {
        const n = parseInt(btn.dataset.num);
        send('number', String(n - 1));  // repeat_count = n-1
        highlightNum(n);
    };
});

function highlightNum(n) {
    document.querySelectorAll('.num-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.num) === n);
    });
}

// ============================================
// 键盘快捷键
// ============================================
document.addEventListener('keydown', (e) => {
    if (e.key >= '1' && e.key <= '9') {
        const n = parseInt(e.key);
        send('number', String(n - 1));
        highlightNum(n);
    } else if (e.key === ' ') {
        e.preventDefault();
        send('pause', currentState.paused ? 'false' : 'true');
    } else if (e.key.toLowerCase() === 'x') {
        send('skip', '');
    } else if (e.key.toLowerCase() === 'q') {
        if (confirm('确定退出？')) send('quit', '');
    }
});

highlightNum(1);

</script>
</body>
</html>
